<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVB Live Map</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #f4f4f4; }
  body { display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); padding: 24px 28px; width: 320px; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a.tile { display: block; padding: 12px 14px; border-radius: 8px; background: #f0f4f8; color: #124;
           text-decoration: none; font-weight: 600; }
  a.tile:hover { background: #e2ecf5; }
  a.tile span { display: block; font-weight: 400; font-size: 12px; color: #567; margin-top: 2px; }
  footer { margin-top: 16px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>KVB Live Map</h1>
  <nav>
    <a class="tile" href="map.html">Live Map<span>Vehicles, network, service alerts</span></a>
    <a class="tile" href="departures.html">Departures<span>Stop search &amp; live departure board</span></a>
    <a class="tile" href="dashboard.html">Dashboard<span>Live &amp; historical stats</span></a>
  </nav>
  <footer>Unofficial companion add-on for kvb-hafas-client. Not affiliated with KVB.</footer>
</div>
