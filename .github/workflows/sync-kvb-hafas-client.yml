name: Sync kvb-hafas-client

# Triggered by kvb-hafas-client's release workflow after it tagged a release.
# Re-locks the unpinned git dependency, takes over the client's version 1:1
# (map version == client version), commits, tags and releases.
# Map-only changes are released by hand with a 4th segment, e.g. 2026.10.0.1
# (HA orders it after 2026.10.0 and before the next client version).
on:
  repository_dispatch:
    types: [kvb-hafas-client-released]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Re-lock kvb-hafas-client
        run: uv lock --upgrade-package kvb-hafas-client

      - name: Take over client version
        id: bump
        env:
          NEXT: ${{ github.event.client_payload.version }}
        run: |
          [ -n "$NEXT" ] || { echo "client_payload.version missing"; exit 1; }
          sed -i -E "s/^version: \".*\"/version: \"$NEXT\"/" config.yaml
          sed -i -E "s/^version = \".*\"/version = \"$NEXT\"/" pyproject.toml
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        run: |
          entry_date=$(date -u +%Y-%m-%d)
          upstream_sha="${{ github.event.client_payload.sha }}"
          upstream_line="Synced bundled UI/library to kvb-hafas-client ${{ steps.bump.outputs.next }}${upstream_sha:+ (@${upstream_sha:0:7})}."
          tmp=$(mktemp)
          {
            head -n 4 CHANGELOG.md
            echo
            echo "## [${{ steps.bump.outputs.next }}] - $entry_date"
            echo
            echo "### Changed"
            echo "- $upstream_line"
            tail -n +5 CHANGELOG.md
          } > "$tmp"
          mv "$tmp" CHANGELOG.md

      - name: Commit, tag, release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock config.yaml pyproject.toml CHANGELOG.md
          git commit -m "chore: sync kvb-hafas-client, bump to $NEXT"
          git tag "v$NEXT"
          git push origin main "v$NEXT"
          gh release create "v$NEXT" --title "v$NEXT" --notes "Synced bundled UI/library to kvb-hafas-client $NEXT. See [CHANGELOG.md](https://github.com/christoph-teichmeister/kvb-ha-map/blob/main/CHANGELOG.md)."
