---
name: "KVB Live Map"
version: "2026.9.5"
slug: "kvb_ha_map"
description: "Live map of KVB (Köln) vehicles, stop departures and history/stats — unofficial companion add-on for kvb-hafas-client."
url: "https://github.com/christoph-teichmeister/kvb-ha-map"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:tram
panel_title: KVB Live Map
webui: "http://[HOST]:[PORT:8099]"
startup: application
boot: auto
map: []
options:
  history_enabled: true
  history_sample_interval_seconds: 60
  history_retention_days: 365
  history_filter_local_only: true
  vehicle_poll_cache_ttl_seconds: 15
  alert_cache_ttl_seconds: 300
  default_map_center_lat: 50.9375
  default_map_center_lon: 6.9603
  default_zoom: 13
  favorite_stop_ids: []
  dashboard_refresh_seconds: 15
  tile_url: ""
  tile_attribution: ""
schema:
  history_enabled: bool
  history_sample_interval_seconds: int(5,3600)
  history_retention_days: int(1,3650)
  history_filter_local_only: bool
  vehicle_poll_cache_ttl_seconds: int(1,600)
  alert_cache_ttl_seconds: int(5,3600)
  default_map_center_lat: float?
  default_map_center_lon: float?
  default_zoom: int(1,19)?
  favorite_stop_ids:
    - "str"
  dashboard_refresh_seconds: int(1,600)
  tile_url: "str?"
  tile_attribution: "str?"
